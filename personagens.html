<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personagens · Nascidos da Bruma</title>
    <meta name="description" content="Personagens do universo de Mistborn (Nascidos da Bruma), de Brandon Sanderson. Site de fã." />
    <meta name="theme-color" content="#0b0a09" />

    <!-- Ícones (gerados por scripts/gerar-icones.js) e manifesto -->
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Prévia ao compartilhar o link (Open Graph) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Nascidos da Bruma" />
    <meta property="og:title" content="Personagens · Nascidos da Bruma" />
    <meta property="og:description" content="Personagens do universo de Mistborn (Nascidos da Bruma), de Brandon Sanderson. Site de fã." />
    <meta property="og:image" content="/icon-512.png" />

    <!-- Fontes do Google: Cinzel (títulos) e Crimson Pro (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />

    <!-- Estilos (Tailwind + tema) e script principal -->
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module" src="/src/main.js"></script>
  </head>

  <body data-pagina="personagens">
    <!-- Header injetado pelo JS (src/components/header.js) -->
    <div id="site-header" class="h-16"></div>

    <main id="conteudo" class="relative flex flex-1 items-center overflow-hidden">
      <!-- Símbolo alomântico grande e apagado ao fundo -->
      <span class="simbolo pointer-events-none absolute -right-32 top-1/2 h-[30rem] w-[30rem] -translate-y-1/2 opacity-[0.08] md:right-0"
            style="--simbolo: url('/images/simbolo-cravos.webp')" aria-hidden="true"></span>

      <section class="relative mx-auto w-full max-w-7xl px-4 py-24 sm:px-8">
        <h1 class="titulo-secao titulo-metal font-bold">Personagens</h1>
        <p class="mt-8 flex items-center gap-4 text-lg italic text-estanho">
          <span class="h-px w-12 bg-latao" aria-hidden="true"></span>
          Página em construção
        </p>
        <p class="mt-4 max-w-xl text-xl text-cinza-400">Esta página ainda está sendo forjada. Em breve, aqui você vai conhecer Vin, Kelsier, Elend, Sazed e os outros nomes que marcaram a trilogia.</p>
        <a href="/" class="botao-secundario mt-10">← Voltar ao início</a>
      </section>
    </main>

    <!-- Footer injetado pelo JS (src/components/footer.js) -->
    <div id="site-footer"></div>
  </body>
</html>
